[project]
name = "embeddings"
version = "0.1.0"
description = "Sentence-transformers embeddings service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.1",
    "sentence-transformers>=5.4.1",
    "torch>=2.0",
    "uvicorn[standard]>=0.46.0",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
