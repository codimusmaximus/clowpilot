services:
  embeddings:
    build: ./embeddings
    ports:
      - "8001:8001"
    restart: unless-stopped

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./workspace:/workspace
      - backend-data:/data
    env_file:
      - ./backend/.env
    environment:
      - WORKSPACE_DIR=/workspace
      - SQLITE_DB_PATH=/data/copilot.sqlite3
      - EMBEDDINGS_URL=http://embeddings:8001
    depends_on:
      - embeddings
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE: http://localhost:8000
    environment:
      - BACKEND_URL=http://backend:8000
      - NEXT_PUBLIC_API_BASE=http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend-data:
